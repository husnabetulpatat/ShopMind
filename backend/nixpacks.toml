[phases.setup]
nixPkgs = ["python311", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "/opt/venv/bin/uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT"
